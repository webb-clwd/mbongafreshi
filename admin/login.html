<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Mbogafreshi</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo -->

        <div class="text-center mb-8">

            <div class="text-4xl mb-3">
                🌱
            </div>

            <h1 class="text-2xl font-bold text-green-700">
                Mbogafreshi
            </h1>

            <p class="text-gray-500 text-sm mt-1">
                Admin Dashboard
            </p>

        </div>


        <!-- Login Card -->

        <div class="bg-white rounded-2xl shadow-sm p-7">

            <h2 class="text-xl font-bold text-gray-900 mb-2">
                Admin Login
            </h2>

            <p class="text-sm text-gray-500 mb-6">
                Sign in to manage Mbogafreshi orders.
            </p>


            <form id="loginForm" class="space-y-5">

                <div>

                    <label class="block text-sm font-medium mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-green-600"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div>

                    <label class="block text-sm font-medium mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-green-600"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <p
                    id="errorMessage"
                    class="hidden text-sm text-red-600 bg-red-50 rounded-lg p-3"
                >
                    Incorrect username or password.
                </p>


                <button
                    type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition"
                >
                    Sign In
                </button>

            </form>


            <div class="mt-6 text-center">

                <a
                    href="../index.html"
                    class="text-sm text-gray-500 hover:text-green-700"
                >
                    ← Back to Mbogafreshi
                </a>

            </div>

        </div>


        <!-- Demo Notice -->

        <p class="text-center text-xs text-gray-400 mt-5">
            Demo login for development only.
        </p>

    </div>


<script>

    /*
    ============================================================
    DEMO ADMIN LOGIN
    ============================================================

    IMPORTANT:

    These credentials are ONLY for testing.

    A real website must NEVER store administrator
    credentials directly inside JavaScript.

    Later we will replace this with a proper backend
    authentication system.
    */


    const DEMO_USERNAME = "admin";

    const DEMO_PASSWORD = "mbogafreshi";


    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const username =
                document.getElementById("username").value.trim();


            const password =
                document.getElementById("password").value;


            const errorMessage =
                document.getElementById("errorMessage");


            if (
                username === DEMO_USERNAME &&
                password === DEMO_PASSWORD
            ) {

                /*
                Store a temporary login flag.
                */

                sessionStorage.setItem(
                    "mbogafreshiAdmin",
                    "true"
                );


                window.location.href =
                    "dashboard.html";


            } else {

                errorMessage.classList.remove(
                    "hidden"
                );

            }

        });

</script>

</body>
</html>
